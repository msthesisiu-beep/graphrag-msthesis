seed: 42
paths:
  raw_dir: .
  teleqna_zip_glob: teleqna-*.zip
  tspec_zip_glob: tspec-*.zip
  tspec_source: directory
  tspec_dir: TSpec-LLM/3GPP-clean
  work_dir: work_tspec17/pilot20
ollama:
  host: http://localhost:11434
  num_ctx: 8192
  keep_alive: 5m
  timeout_s: 900
  max_retries: 3
  gen_max_tokens: 512
models:
  generator: qwen2.5:7b-instruct
  generator_hf_tokenizer: Qwen/Qwen2.5-7B-Instruct
  verifier: llama3.1:8b
  evaluator: gemma2:9b
  kg_extractor: mistral-nemo:12b
  ragas_embeddings: nomic-embed-text
encoders:
  device: mps
  embedder: BAAI/bge-base-en-v1.5
  pool_dense: intfloat/e5-base-v2
  reranker: BAAI/bge-reranker-base
corpus:
  release: 17
  specs:
  - '23.501'
  - '23.502'
  - '24.501'
  - '38.300'
  - '38.331'
  min_tokens: 300
  max_tokens: 500
  skip_sections:
  - contents
  - foreword
benchmark:
  categories:
  - Standards specifications
  - Standards overview
  pool_k: 50
  verify_top_n: 10
  verify_batch: 5
  target_questions: 500
  min_questions: 300
  dev_fraction: 0.2
  manual_sample_per_class: 100
  gate_precision: 0.9
  gate_kappa: 0.7
retrieval:
  candidates: 30
  rerank_keep: 5
  rerank_threshold: null
kg:
  scope: candidates
  max_triples_per_passage: 15
  entity_types:
  - NetworkFunction
  - Interface
  - ReferencePoint
  - Message
  - Procedure
  - Timer
  - Requirement
  - Parameter
  - Protocol
  - State
  - Service
  - Entity
  relations:
  - sends
  - receives
  - provides_service
  - consumes_service
  - uses_interface
  - connects_to
  - part_of
  - performs
  - triggers
  - initiates
  - terminates
  - configures
  - selects
  - stores
  - subscribes_to
  - notifies
  - depends_on
  - requires
  - has_timer
  - has_parameter
  - starts_timer
  - stops_timer
  - is_a
  - supports
  - controls
  default_variant:
    triples: 10
    hops: 1
    share: 0.2
  grid:
    triples:
    - 5
    - 10
    - 20
    hops:
    - 1
    - 2
    share:
    - 0.1
    - 0.2
    - 0.3
  audit_sample: 200
run:
  repeats: 1
  budget_tolerance: 0.05
pricing_usd_per_1m_tokens:
  input: 0.15
  output: 0.6
  assumption: gpt-4o-mini list price used as hosted-equivalent
